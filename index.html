<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comentarios con React</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <!-- ReactDOM -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para procesar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Punto de montaje -->
  <div id="root"></div>

  <!-- Código React con JSX -->
  <script type="text/babel">
    // Componente funcional de saludo
    function Greeting() {
      return <h1>¡Hola, bienvenido a React!</h1>;
    }

    // Componente hijo: formulario de comentario
    function CommentForm({ onAddComment }) {
      const [inputValue, setInputValue] = React.useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (inputValue.trim()) {
          onAddComment(inputValue);
          setInputValue('');
        }
      };

      return (
        <form onSubmit={handleSubmit}>
          <input 
            type="text" 
            value={inputValue} 
            onChange={(e) => setInputValue(e.target.value)} 
            placeholder="Escribe un comentario" 
          />
          <button type="submit">Enviar comentario</button>
        </form>
      );
    }

    // Componente padre: App
    function App() {
      const [comments, setComments] = React.useState([]);

      const addComment = (newComment) => {
        setComments([...comments, newComment]);
      };

      return (
        <div>
          <Greeting />
          <CommentForm onAddComment={addComment} />
          <h2>Comentarios:</h2>
          <ul>
            {comments.map((comment, index) => (
              <li key={index}>{comment}</li>
            ))}
          </ul>
        </div>
      );
    }

    // Renderizado principal
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
